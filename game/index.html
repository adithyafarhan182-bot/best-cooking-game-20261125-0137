<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle &amp; Serve — Milo the Cat Chef's Kitchen</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2118; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; background: #f7ead7;
    box-shadow: 0 0 0 4px #1f5c5a, 0 18px 48px rgba(0, 0, 0, 0.55); }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sizzle and Serve: a cooking game. Move Milo the cat chef with WASD or arrow keys, press E to chop, cook, plate and serve customer orders before their patience runs out."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
